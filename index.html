<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="card">
        <div class="search">
            <input class="input" type="text" placeholder="Enter city name" spellcheck="false" >
            <button class="search-button"><img class="search-icon" src="images/search.png" alt="Search"></button>
        </div>
        <div class="weather">
            <img src="Cloud_files/clear-day(1).svg" alt="Sunny" class="weather-icon">
            <h1 class="temperature">22°C</h1>
            <h2 class="city">Kathmandu</h2>

            
           <div class="details">
            <div class="col">
                <img src="Cloud_files/humidity.svg" alt="Humidity" class="humidity-icon">
                <div>
                    <p class="humidity-value">65%</p>
                    <p class="humidity">Humidity</p>
                </div>
            </div>


            <div class="col">
                <img src="Cloud_files/wind.svg" alt="Wind" class="wind-icon">
                <div>
                    <p class="wind-value">15 km/h</p>
                    <p class="wind">Wind</p>
                </div>
           </div>
        
            </div>
        </div>
    </div>
</body>
</html>
